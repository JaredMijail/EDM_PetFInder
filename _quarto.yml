project:
  type: website
  output-dir: _site
  # Solo se renderizan archivos .qmd: así los intermedios de knitr (*.knit.md)
  # no se publican como si fueran páginas del sitio.
  render:
    - "*.qmd"
    - "**/*.qmd" 

website:
  title: "EDM_PetFinder"
  description: >-
    Predicción de la velocidad de adopción de mascotas (PetFinder.my) mediante
    aprendizaje supervisado sobre datos secundarios: señales tabulares, textuales y visuales.
  site-url: https://jaredmijail.github.io/EDM_PetFInder/
  repo-url: https://github.com/JaredMijail/EDM_PetFInder
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false
  search:
    location: navbar
    type: overlay
    limit: 30
    show-item-context: true
  navbar:
    pinned: true
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "El proyecto"
        menu:
          - text: "Planteamiento del problema"
            href: proyecto/planteamiento.qmd
          - text: "Marco conceptual"
            href: proyecto/marco-conceptual.qmd
          - text: "Objetivos"
            href: proyecto/objetivos.qmd
          - text: "Justificación"
            href: proyecto/justificacion.qmd
          - text: "Metodología"
            href: proyecto/metodologia.qmd
          - text: "Productos esperados"
            href: proyecto/productos.qmd
          - text: "Bibliografía"
            href: proyecto/bibliografia.qmd
      - text: "Entrega 01"
        menu:
          - text: "Descripción"
            href: entregas/descripcion.qmd
          - text: "Análisis Univariado Diagnóstico"
            href: entregas/analisis_univariado.qmd
          - text: "Análisis exploratorio"
            href: entregas/analisis-exploratorio.qmd
          - text: "Dataset y enriquecimiento"
            href: entregas/dataset.qmd
      - text: "Acerca de"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/JaredMijail/EDM_PetFInder
        aria-label: "Repositorio en GitHub"
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: "Inicio"
        contents:
          - index.qmd
      - section: "El proyecto"
        contents:
          - proyecto/planteamiento.qmd
          - proyecto/marco-conceptual.qmd
          - proyecto/objetivos.qmd
          - proyecto/justificacion.qmd
          - proyecto/metodologia.qmd
          - proyecto/productos.qmd
          - proyecto/bibliografia.qmd
      - section: "Entrega 01"
        contents:
          - entregas/descripcion.qmd
          - analisis_univariado.qmd
          - entregas/analisis-exploratorio.qmd
          - entregas/dataset.qmd
      - section: "Información"
        contents:
          - about.qmd
  page-footer:
    left: "EDM_PetFinder · Universidad Nacional de Colombia"
    center: "EDM — Estadística Descriptiva Multivariada"
    right:
      - icon: github
        href: https://github.com/JaredMijail/EDM_PetFInder
        aria-label: "Repositorio en GitHub"
  open-graph: true
  twitter-card: true

lang: es

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "En esta página"
    number-sections: false
    code-fold: true
    code-summary: "Ver código"
    code-tools: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    citations-hover: true
    footnote-hover: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    fig-responsive: true
    fig-align: center
    lightbox: true
    grid:
      sidebar-width: 250px
      body-width: 960px
      margin-width: 280px
      gutter-width: 1.4rem
    include-in-header:
      - text: |
          <meta name="author" content="Jared Mijail Ramírez Escalante, María Paula Silva Capera">
          <meta name="keywords" content="PetFinder, adopción de mascotas, aprendizaje supervisado, datos masivos, EDM, R, Quarto, kappa cuadrático">

execute:
  freeze: auto
  warning: false
  message: false
  echo: true

bibliography: referencias.bib

editor: visual
